        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");

        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["DM Sans", "sans-serif"],
              mono: ["DM Mono", "monospace"],

                100: "#ede9fe",
                500: "#6366f1",
                600: "#4f46e5",
                700: "#4338ca",

        from {

        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fadeIn {

      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;

    <script>
      let quizData = null; // Se llenará automáticamente con el JSON externo
      let currentQuestionIndex = 0;
      let userAnswers = [];
      let isReviewMode = false;

      // --- Configuración del Curso Parseada ---
      const CONFIG_CURSO = {
        nombre_curso: typeof NOMBRE_CURSO !== "undefined" ? NOMBRE_CURSO : "DERECHO MINERO",
        clases: {},
      };

      if (typeof TEXTO_CLASES !== "undefined") {
        TEXTO_CLASES.trim()
          .split("\n")
          .forEach((line) => {
            const trimmed = line.trim();
            if (!trimmed) return;
            const match = trimmed.match(/^(\d+)\s+(.+)$/);
            if (match) {
              const numero = parseInt(match[1], 10);
              const titulo = match[2].trim();
              CONFIG_CURSO.clases[numero] = titulo;
            }
          });
      }

      // --- Control de Tema Oscuro ---
      function updateThemeUI() {
        const isDark = document.documentElement.classList.contains("dark");
        const icon = document.querySelector(".theme-icon");
        if (icon) {
          if (isDark) {
            icon.className = "theme-icon ph-bold ph-sun text-lg text-amber-400";
            icon.parentElement.title = "Activar modo claro";
          } else {
            icon.className = "theme-icon ph-bold ph-moon text-lg text-slate-400";
            icon.parentElement.title = "Activar modo oscuro";
          }
        }
      }

      function toggleTheme() {
        playTone("tap");
        const isDark = document.documentElement.classList.toggle("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        updateThemeUI();
      }

      // --- KaTeX Auto-Render Helper ---
      function renderMath() {
        if (typeof renderMathInElement === "function") {
          renderMathInElement(document.body, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false },
              { left: "\\(", right: "\\)", display: false },
              { left: "\\[", right: "\\]", display: true },
            ],
            throwOnError: false,
          });
        }
      }

      // --- Web Audio API Synth Settings ---
      let audioCtx = null;
      let isMuted = localStorage.getItem("quiz_muted") === "true";

      function getAudioContext() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function updateMuteUI() {
        const icons = document.querySelectorAll(".mute-icon");
        icons.forEach((icon) => {
          if (isMuted) {
            icon.className = "mute-icon ph-bold ph-speaker-slash text-rose-500";
            icon.parentElement.title = "Activar sonido";
          } else {
            icon.className = "mute-icon ph-bold ph-speaker-high text-slate-400";
            icon.parentElement.title = "Silenciar sonido";
          }
        });
      }

      function toggleMute() {
        isMuted = !isMuted;
        localStorage.setItem("quiz_muted", isMuted);
        updateMuteUI();
      }

      // 🟢 Acierto: Un tono doble armónico (Do5 / Mi5), rápido y ascendente (agudo/alegre).
      function playHitSound() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        // NOTA 1: Do (C5) - Inicio inmediato
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = "sine";
        osc1.frequency.setValueAtTime(523.25, now);
        gain1.gain.setValueAtTime(0.08, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.15);

        // NOTA 2: Mi (E5) - Entra con un ligero retraso de 80ms
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = "sine";
        osc2.frequency.setValueAtTime(659.25, now + 0.08);
        gain2.gain.setValueAtTime(0.08, now + 0.08);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.08);
        osc2.stop(now + 0.3);
      }

      // 🔴 Error: Un tono grave, corto y descendente (tipo 'buzzer').
      function playErrorSound() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.2);

        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

        osc.start(now);
        osc.stop(now + 0.2);
      }

      // 🔘 Toque: Un sonido sutil y corto para transiciones de botones.
      function playTapSound() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.type = "sine";
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);

        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);

        osc.start(now);
        osc.stop(now + 0.1);
      }

      // 🏆 Éxito final: Una pequeña melodía de celebración (acorde mayor sostenido arpegiado).
      function playSuccessSound() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        const notes = [
          { freq: 261.63, delay: 0.0, type: "sine" }, // C4
          { freq: 329.63, delay: 0.1, type: "sine" }, // E4
          { freq: 392.0, delay: 0.2, type: "sine" }, // G4
          { freq: 523.25, delay: 0.3, type: "triangle" }, // C5
          { freq: 659.25, delay: 0.4, type: "triangle" }, // E5
          { freq: 783.99, delay: 0.5, type: "sine" }, // G5
        ];

        notes.forEach((note) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = note.type;
          osc.frequency.setValueAtTime(note.freq, now + note.delay);

          gain.gain.setValueAtTime(0, now);
          gain.gain.setValueAtTime(0.06, now + note.delay);
          gain.gain.setValueAtTime(0.06, now + note.delay + 0.4);
          gain.gain.exponentialRampToValueAtTime(0.001, now + note.delay + 1.2);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now + note.delay);
          osc.stop(now + note.delay + 1.3);
        });
      }

      function playTone(type) {
        if (isMuted) return;
        try {
          if (type === "success") {
            playHitSound();
          } else if (type === "error") {
            playErrorSound();
          } else if (type === "complete") {
            playSuccessSound();
          } else if (type === "tap") {
            playTapSound();
          }
        } catch (e) {
          console.warn("Web Audio API no soportada o bloqueada por políticas del navegador:", e);
        }
      }

      // ==========================================
      // 1. Leemos el parámetro directamente de la query string (lo que sigue al "?")
      const parametroClase = window.location.search.substring(1) || "clase-1";

      // 2. Extraemos el número de la clase para mostrar la información correcta del curso
      const matchNumero = parametroClase.match(/\d+/);
      const numeroClase = matchNumero ? parseInt(matchNumero[0], 10) : 1;

      // 3. Le agregamos la extensión .json de forma automática
      const ARCHIVO_JSON = `${parametroClase}.json`; // ==========================================

      // Optimización: Iniciamos la descarga del archivo JSON inmediatamente para evitar esperas
      const quizDataPromise = fetch(ARCHIVO_JSON).then((response) => {
        if (!response.ok) {
          throw new Error(`El archivo "${ARCHIVO_JSON}" no existe o no se pudo cargar.`);
        }
        return response.json();
      });

      window.addEventListener("DOMContentLoaded", async () => {
        // Inicializar UI de silencio y de tema según estado persistido
        updateMuteUI();
        updateThemeUI();

        // Carga inmediata de la configuración local (cero lag visual en títulos)
        const courseName = CONFIG_CURSO.nombre_curso || "DERECHO MINERO";
        document.getElementById("welcome-course-name").innerText = courseName;

        const classTitle = CONFIG_CURSO.clases[numeroClase] || "";
        const headerNumber = document.getElementById("header-class-number");
        const headerTitle = document.getElementById("header-class-title");
        if (headerNumber) {
          headerNumber.innerText = `CLASE ${numeroClase}`;
        }
        if (headerTitle) {
          headerTitle.innerText = classTitle ? `: ${classTitle.toUpperCase()}` : "";
        }

        document.getElementById("welcome-class-number").innerText = `Clase ${numeroClase}`;
        document.getElementById("welcome-class-title").innerText = classTitle.toUpperCase();
        document.getElementById("welcome-class-description").innerText = `¡Te damos la bienvenida al cuestionario interactivo de la Clase ${numeroClase}! Esta herramienta está diseñada para consolidar tus conocimientos técnicos de manera amigable y didáctica. No es calificable, así que disfruta del aprendizaje.`;

        try {
          // Esperamos a que termine la promesa de descarga iniciada al principio
          quizData = await quizDataPromise;

          // Inicializamos las respuestas vacías basadas en las preguntas cargadas
          userAnswers = Array(quizData.quiz.length).fill(null);

          // Función auxiliar para obtener un subconjunto aleatorio de elementos (máximo 5)
          function getRandomSubarray(array, size) {
            if (!array) return [];
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled.slice(0, size);
          }

          // Rellenamos los temas en la portada de bienvenida (reemplaza el skeleton loader)
          const coveredList = document.getElementById("covered-topics-list");
          coveredList.innerHTML = "";
          const selectedCovered = getRandomSubarray(quizData.topics.covered, 5);
          selectedCovered.forEach((topic) => {
            const li = document.createElement("li");
            li.className = "flex items-center gap-3 text-slate-600 dark:text-slate-300";
            li.innerHTML = `<i class="ph-fill ph-check-circle text-brand-500 dark:text-brand-400 shrink-0 text-base"></i><span class="leading-snug">${topic}</span>`;
            coveredList.appendChild(li);
          });

          const suggestedList = document.getElementById("suggested-topics-list");
          suggestedList.innerHTML = "";
          const selectedSuggested = getRandomSubarray(quizData.topics.followUp, 5);
          selectedSuggested.forEach((topic) => {
            const li = document.createElement("li");
            li.className = "flex items-center gap-3 text-indigo-950/80 dark:text-indigo-200";
            li.innerHTML = `<i class="ph-bold ph-trend-up text-brand-500 dark:text-brand-400 shrink-0 text-base"></i><span class="leading-snug">${topic}</span>`;
            suggestedList.appendChild(li);
          });

          // Activamos el botón de empezar cuestionario
          const startBtn = document.getElementById("start-quiz-button");
          if (startBtn) {
            startBtn.removeAttribute("disabled");
            startBtn.className = "w-full sm:w-auto px-8 py-3 bg-brand-600 hover:bg-brand-700 active:scale-95 text-white font-bold rounded-2xl border border-transparent shadow-lg shadow-brand-200 dark:shadow-none transition-all duration-300 flex items-center justify-center gap-3 group text-base";
            startBtn.innerHTML = `¡Empezar cuestionario! <i class="ph-bold ph-arrow-right text-lg transform group-hover:translate-x-1 transition-transform"></i>`;
          }

          renderMath();
        } catch (error) {
          console.error("Error al cargar el archivo de preguntas JSON:", error);

          // Ocultamos la pantalla de bienvenida y mostramos la pantalla de error
          document.getElementById("welcome-screen").classList.add("hidden");
          const errorScreen = document.getElementById("error-screen");
          errorScreen.classList.remove("hidden");

          const errorMsg = document.getElementById("error-message");
          errorMsg.innerText = `El archivo de preguntas "${ARCHIVO_JSON}" no existe o no se pudo cargar desde el servidor local.`;
        }
      });

      function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      function startQuiz() {
        if (!quizData) return;

        // Barajar aleatoriamente las opciones de respuesta para cada pregunta
        quizData.quiz.forEach((question) => {
          if (question.answerOptions) {
            shuffleArray(question.answerOptions);
          }
        });

        // Warm up the AudioContext on user gesture
        try {
          getAudioContext();
        } catch (e) {}

        playTone("tap");

        document.getElementById("welcome-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");
        document.getElementById("quiz-screen").classList.add("fade-in-up");
        isReviewMode = false;
        currentQuestionIndex = 0;
        userAnswers.fill(null);
        document.getElementById("review-banner").classList.add("hidden");
        loadQuestion();
      }

      function renderProgressBar() {
        const container = document.getElementById("progress-segments");
        container.innerHTML = "";
        quizData.quiz.forEach((_, idx) => {
          const segment = document.createElement("div");
          segment.className = "h-2 flex-1 rounded-full transition-all duration-300 cursor-pointer";
          segment.onclick = () => jumpToQuestion(idx);

          if (isReviewMode) {
            const ans = userAnswers[idx];
            if (ans === null) {
              segment.className += ` ${idx === currentQuestionIndex ? "ring-2 ring-indigo-600 ring-offset-2 dark:ring-offset-slate-900" : ""} bg-amber-400`;
            } else {
              const isCorrect = quizData.quiz[idx].answerOptions[ans].isCorrect;
              segment.className += ` ${idx === currentQuestionIndex ? "ring-2 ring-indigo-600 ring-offset-2 dark:ring-offset-slate-900" : ""} ${isCorrect ? "bg-emerald-500" : "bg-rose-500"}`;
            }
          } else {
            if (idx < currentQuestionIndex) {
              const ans = userAnswers[idx];
              if (ans === null) {
                segment.className += " bg-amber-400";
              } else {
                segment.className += ` ${quizData.quiz[idx].answerOptions[ans].isCorrect ? "bg-emerald-500" : "bg-rose-500"}`;
              }
            } else if (idx === currentQuestionIndex) {
              segment.className += " bg-brand-500 animate-pulse";
            } else {
              segment.className += " bg-slate-200 dark:bg-slate-800";
            }
          }
          container.appendChild(segment);
        });
      }

      function jumpToQuestion(idx) {
        if (!quizData) return;
        if (idx === currentQuestionIndex) return;
        playTone("tap");
        currentQuestionIndex = idx;
        loadQuestion();
      }

      function loadQuestion() {
        const currentQuestion = quizData.quiz[currentQuestionIndex];
        document.getElementById("hint-box").classList.remove("active");
        const hintBtn = document.getElementById("hint-button");

        if (currentQuestion.hint && !isReviewMode) {
          hintBtn.classList.remove("hidden");
          document.getElementById("hint-text").innerText = currentQuestion.hint;
        } else {
          hintBtn.classList.add("hidden");
        }

        document.getElementById("question-index-badge").innerText = `Pregunta ${currentQuestionIndex + 1} de ${quizData.quiz.length}`;
        document.getElementById("question-text").innerText = currentQuestion.question;
        renderProgressBar();

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";
        const alphabet = ["A", "B", "C", "D"];
        const answeredIndex = userAnswers[currentQuestionIndex];
        const isAnswered = answeredIndex !== null;

        currentQuestion.answerOptions.forEach((option, index) => {
          const optionCard = document.createElement("div");
          optionCard.className = "w-full text-left p-4 rounded-2xl border-2 transition-all flex flex-col relative duration-200 shadow-sm";

          if (isAnswered || isReviewMode) {
            if (option.isCorrect) {
              optionCard.className += " border-emerald-500 dark:border-emerald-500/80 bg-emerald-50/40 dark:bg-emerald-950/25 text-emerald-700 dark:text-emerald-300";
            } else if (answeredIndex === index && !option.isCorrect) {
              optionCard.className += " border-rose-500 dark:border-rose-500/80 bg-rose-50/40 dark:bg-rose-950/25 text-rose-700 dark:text-rose-300";
            } else {
              optionCard.className += " border-slate-200 dark:border-slate-800 bg-slate-50/40 dark:bg-slate-950/40 text-slate-500 dark:text-slate-400 opacity-90";
            }
          } else {
            optionCard.className += " border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950/50 hover:bg-brand-50/50 dark:hover:bg-brand-950/30 hover:border-brand-500 dark:hover:border-brand-400 hover:shadow-md hover:shadow-brand-500/5 dark:hover:shadow-none cursor-pointer active:scale-[0.99] group";
            optionCard.onclick = () => selectOption(index);
          }

          const letterClass = isAnswered || isReviewMode ? (option.isCorrect ? "text-emerald-700 dark:text-emerald-300" : answeredIndex === index ? "text-rose-700 dark:text-rose-300" : "text-slate-400 dark:text-slate-500") : "text-slate-400 dark:text-slate-500 group-hover:text-brand-500 dark:group-hover:text-brand-400";
          const textClass = isAnswered || isReviewMode ? (option.isCorrect ? "text-emerald-700 dark:text-emerald-300 font-bold" : answeredIndex === index ? "text-rose-700 dark:text-rose-300 font-bold" : "text-slate-700 dark:text-slate-300 font-medium") : "text-slate-700 dark:text-slate-300 font-medium";

          let cardContent = `<div class="flex items-baseline gap-3 w-full"><span class="font-bold ${letterClass} text-base select-none transition-colors shrink-0">${alphabet[index]}.</span><div class="flex-1 min-w-0"><p class="${textClass} text-base transition-colors">${option.text}</p>`;

          if (isAnswered || isReviewMode) {
            if (option.isCorrect) {
              cardContent += `<div class="text-emerald-600 dark:text-emerald-400 font-bold text-sm mt-1.5 flex items-center gap-1.5 animate-fadeIn"><i class="ph-fill ph-check-circle text-base shrink-0"></i> Respuesta correcta</div><p class="text-sm text-emerald-600 dark:text-emerald-400 mt-1.5 font-medium animate-fadeIn">${option.rationale}</p>`;
            } else if (answeredIndex === index && !option.isCorrect) {
              cardContent += `<div class="text-rose-600 dark:text-rose-400 font-bold text-sm mt-1.5 flex items-center gap-1.5 animate-fadeIn"><i class="ph-fill ph-x-circle text-base shrink-0"></i> Respuesta incorrecta</div><p class="text-sm text-rose-600 dark:text-rose-400 mt-1.5 font-medium animate-fadeIn">${option.rationale}</p>`;
            } else {
              cardContent += `<p class="text-sm text-slate-600 dark:text-slate-400 mt-1.5 font-medium animate-fadeIn">${option.rationale}</p>`;
            }
          }
          cardContent += `</div></div>`;
          optionCard.innerHTML = cardContent;
          optionsContainer.appendChild(optionCard);
        });

        const prevBtn = document.getElementById("prev-button");
        const nextBtn = document.getElementById("next-button");

        // El botón anterior siempre se muestra. En la primera pregunta, sirve para volver al inicio.
        prevBtn.classList.remove("hidden");
        prevBtn.disabled = false;

        if (isReviewMode) {
          nextBtn.disabled = false;
          nextBtn.className = "flex-1 sm:flex-initial w-full sm:w-auto px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-2xl border border-transparent shadow-sm dark:shadow-none active:scale-95 transition-all flex items-center justify-center gap-2 ml-auto text-base";
          nextBtn.innerHTML = currentQuestionIndex === quizData.quiz.length - 1 ? `Finalizar Revisión <i class="ph-bold ph-check text-lg"></i>` : `Siguiente <i class="ph-bold ph-caret-right text-lg"></i>`;
        } else {
          nextBtn.disabled = false;
          if (isAnswered) {
            nextBtn.className = "flex-1 sm:flex-initial w-full sm:w-auto px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-2xl border border-transparent shadow-sm dark:shadow-none active:scale-95 transition-all duration-300 flex items-center justify-center gap-2 ml-auto group text-base";
            if (currentQuestionIndex === quizData.quiz.length - 1) {
              nextBtn.innerHTML = `Listo <i class="ph-bold ph-check text-lg transform group-hover:scale-110 transition-transform"></i>`;
            } else {
              nextBtn.innerHTML = `Siguiente <i class="ph-bold ph-caret-right text-lg transform group-hover:translate-x-1 transition-transform"></i>`;
            }
          } else {
            nextBtn.className = "flex-1 sm:flex-initial w-full sm:w-auto px-6 py-3 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold rounded-2xl border border-slate-200/60 dark:border-slate-700/60 shadow-sm active:scale-95 transition-all duration-300 flex items-center justify-center gap-2 ml-auto group text-base";
            nextBtn.innerHTML = `Omitir <i class="ph-bold ph-caret-right text-lg transform group-hover:translate-x-1 transition-transform"></i>`;
          }
        }
        renderMath();
      }

      function toggleHint() {
        document.getElementById("hint-box").classList.toggle("active");
      }
      function selectOption(selectedIndex) {
        userAnswers[currentQuestionIndex] = selectedIndex;

        // Play sound based on correctness
        const currentQuestion = quizData.quiz[currentQuestionIndex];
        const isCorrect = currentQuestion.answerOptions[selectedIndex].isCorrect;
        if (isCorrect) {
          playTone("success");
        } else {
          playTone("error");
        }

        loadQuestion();
      }

      function nextQuestion() {
        if (isReviewMode) {
          if (currentQuestionIndex < quizData.quiz.length - 1) {
            playTone("tap");
            currentQuestionIndex++;
            loadQuestion();
          } else {
            exitReview();
          }
        } else {
          playTone("tap");
          currentQuestionIndex++;
          if (currentQuestionIndex < quizData.quiz.length) {
            loadQuestion();
          } else {
            showResults(true);
          }
        }
      }

      function prevQuestion() {
        if (currentQuestionIndex > 0) {
          playTone("tap");
          currentQuestionIndex--;
          loadQuestion();
        } else {
          if (isReviewMode) {
            exitReview();
          } else {
            goHome();
          }
        }
      }

      function calculateStats() {
        let correct = 0,
          incorrect = 0,
          omitted = 0;
        quizData.quiz.forEach((q, idx) => {
          const ans = userAnswers[idx];
          if (ans === null) {
            omitted++;
          } else if (q.answerOptions[ans].isCorrect) {
            correct++;
          } else {
            incorrect++;
          }
        });
        return { correct, incorrect, omitted };
      }

      function showResults(playCelebrate = true) {
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");

        // Play final completion sound if requested
        if (playCelebrate) {
          playTone("complete");
        }

        const stats = calculateStats();
        const total = quizData.quiz.length;
        const scorePercent = Math.round((stats.correct / total) * 100);

        document.getElementById("score-fraction").innerText = `${stats.correct}/${total}`;
        document.getElementById("stats-correct").innerText = stats.correct;
        document.getElementById("stats-incorrect").innerText = stats.incorrect;
        document.getElementById("stats-omitted").innerText = stats.omitted;

        const omittedContainer = document.getElementById("stats-omitted-container");
        if (stats.omitted > 0) {
          omittedContainer.classList.remove("hidden");
        } else {
          omittedContainer.classList.add("hidden");
        }

        let currentPct = 0;
        const scoreText = document.getElementById("final-score");
        const steps = 60;
        const increment = scorePercent / steps;

        const counterInterval = setInterval(() => {
          currentPct += increment;
          if (currentPct >= scorePercent) {
            currentPct = scorePercent;
            clearInterval(counterInterval);
          }
          scoreText.innerText = `${Math.floor(currentPct)} %`;
        }, 20);

        const circlePath = document.getElementById("score-circle-path");
        const radius = circlePath.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;

        circlePath.style.strokeDasharray = `${circumference} ${circumference}`;
        const offset = circumference - (scorePercent / 100) * circumference;

        const fractionText = document.getElementById("score-fraction");
        circlePath.classList.remove("stroke-brand-500", "stroke-emerald-500", "stroke-amber-500", "stroke-rose-500");
        fractionText.classList.remove("text-emerald-600", "text-amber-600", "text-rose-600");
        fractionText.classList.add("text-slate-800", "dark:text-slate-100");

        if (scorePercent >= 80) {
          circlePath.classList.add("stroke-emerald-500");
          fractionText.classList.remove("text-slate-800", "dark:text-slate-100");
          fractionText.classList.add("text-emerald-600");
          launchConfetti();
        } else if (scorePercent >= 50) {
          circlePath.classList.add("stroke-amber-500");
          fractionText.classList.remove("text-slate-800", "dark:text-slate-100");
          fractionText.classList.add("text-amber-600");
        } else {
          circlePath.classList.add("stroke-rose-500");
          fractionText.classList.remove("text-slate-800", "dark:text-slate-100");
          fractionText.classList.add("text-rose-600");
        }

        setTimeout(() => {
          circlePath.style.strokeDashoffset = offset;
        }, 100);
        renderMath();
      }

      function launchConfetti() {
        const container = document.getElementById("confeti-container");
        container.classList.remove("hidden");
        container.innerHTML = "";
        const colors = ["#6366f1", "#ff7e5f", "#10b981", "#3b82f6", "#f59e0b"];
        for (let i = 0; i < 55; i++) {
          const div = document.createElement("div");
          div.className = "absolute w-3 h-3 rounded-sm confetti-slow shadow-sm";
          div.style.left = `${Math.random() * 100}%`;
          div.style.top = `-${Math.random() * 20}px`;
          div.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          div.style.animationDelay = `${Math.random() * 2.5}s`;
          div.style.transform = `rotate(${Math.random() * 360}deg)`;
          container.appendChild(div);
        }
      }

      function enterReviewMode() {
        playTone("tap");
        isReviewMode = true;
        currentQuestionIndex = 0;
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("review-banner").classList.remove("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");
        loadQuestion();
      }

      function exitReview() {
        playTone("tap");
        isReviewMode = false;
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("review-banner").classList.add("hidden");
        showResults(false);
      }

      function goHome() {
        playTone("tap");
        isReviewMode = false;
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("review-banner").classList.add("hidden");
        document.getElementById("confeti-container").classList.add("hidden");
        document.getElementById("welcome-screen").classList.remove("hidden");
        document.getElementById("welcome-screen").classList.add("fade-in-up");
        const circlePath = document.getElementById("score-circle-path");
        if (circlePath) {
          circlePath.style.strokeDashoffset = circlePath.r.baseVal.value * 2 * Math.PI;
        }
      }

      function restartQuiz() {
        goHome();
      }
    </script>
    <div id="quiz-navigation-bar" class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 px-6 py-3 md:px-8 z-40 flex justify-center">
      <div class="w-full max-w-2xl">
        <!-- Botones de Bienvenida -->
        <div id="nav-welcome-buttons" class="hidden justify-center w-full">
          <button id="start-quiz-button" disabled onclick="startQuiz()" class="w-full sm:w-auto px-8 py-3 bg-slate-200 dark:bg-slate-800 text-slate-400 dark:text-slate-600 font-bold rounded-2xl border border-transparent transition-all duration-300 flex items-center justify-center gap-3 cursor-not-allowed text-base">
            <span>Cargando cuestionario...</span>
            <i class="ph-bold ph-circle-notch animate-spin text-lg"></i>
          </button>
        </div>

        <!-- Botones del Cuestionario -->
        <div id="nav-quiz-buttons" class="hidden justify-between items-center gap-4 w-full">
          <button id="prev-button" onclick="prevQuestion()" class="hidden flex-1 sm:flex-initial w-full sm:w-auto px-6 py-3 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold rounded-2xl border border-slate-200/60 dark:border-slate-700/60 shadow-sm active:scale-95 transition-all duration-300 flex items-center justify-center gap-2 text-base group"><i class="ph-bold ph-caret-left text-lg transform group-hover:-translate-x-1 transition-transform"></i> Anterior</button>
          <button id="next-button" onclick="nextQuestion()" class="flex-1 sm:flex-initial w-full sm:w-auto px-6 py-3 bg-slate-100 text-slate-400 font-bold rounded-2xl border border-transparent transition-all duration-300 flex items-center justify-center gap-2 ml-auto text-base"></button>
        </div>

        <!-- Botones de Resultados -->
        <div id="nav-result-buttons" class="hidden flex-col sm:flex-row gap-4 justify-center items-center w-full">
          <button onclick="enterReviewMode()" class="flex-1 sm:flex-initial w-full sm:w-auto px-6 py-3 bg-brand-50 hover:bg-brand-100 text-brand-700 font-bold rounded-2xl border border-brand-200 shadow-sm active:scale-95 transition-all duration-300 flex items-center justify-center gap-2 text-base dark:bg-brand-950/40 dark:text-brand-300 dark:border-brand-900/50 dark:hover:bg-brand-900/60"><i class="ph-bold ph-eyeglasses text-lg"></i> Revisar cuestionario</button>
          <button onclick="restartQuiz()" class="flex-1 sm:flex-initial w-full sm:w-auto px-6 py-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold rounded-2xl shadow-sm active:scale-95 transition-all duration-300 flex items-center justify-center gap-2 text-base"><i class="ph-bold ph-arrow-counter-clockwise text-lg"></i> Intentar de nuevo</button>
        </div>
      </div>
    </div>
  </body>
</html>
